esphome:
  name: panellan-nv3041a
  min_version: "2026.10.2"
  project:
    name: "tpruvot.nv3041a_i80"
    version: 0.2.0
  on_boot:
    priority: -100
    then:
      lambda: "id(bip_ok).execute();"

substitutions:
  device_description: "SCO7 4.3 Panel CAN/RS485"
  wifi_ip: 192.168.0.89

esp32:
  board: esp32-s3-devkitc1-n16r2
  variant: ESP32S3
  flash_size: 16MB
  watchdog_timeout: 30s
  cpu_frequency: 160MHZ
  flash_mode: qio
  flash_frequency: 40MHZ
  framework:
    type: esp-idf
    components: [ esp_lcd_panel_io_additions==1.0.1 ]
    advanced:
      flash_chip: generic
    sdkconfig_options:
      CONFIG_GDMA_CTRL_ALLOC_FROM_INTERNAL: "y"
      # FREE some IRAM....
      CONFIG_SPI_FLASH_ROM_IMPL: "y"
      CONFIG_HEAP_PLACE_FUNCTION_IN_IRAM: "n"
      CONFIG_HAL_DEFAULT_ASSERTION_LEVEL: "0"

# GDMA Related
psram:
  mode: quad
  speed: 80MHz

external_components:
  - source:
      type: local
      path: .

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  output_power: 13dB
  manual_ip:
    subnet: 255.255.255.0
    gateway: 192.168.0.254
    dns1: 192.168.0.254
    dns2: 8.8.8.8
    static_ip: ${wifi_ip}
  ap:
    ssid: PANEL_CAN
    password: !secret wifi_ap_password

ota:
  platform: esphome
  encryption:

logger:
  level: INFO
  # level: VERBOSE
  # initial_level: INFO
  # logs:
  #   i2c: INFO
  #   touchscreen: VERBOSE
  #   ?: INFO

captive_portal:
# web_server:
#   version: 2

api:
  encryption:
    key: !secret esphome_api_key

canbus:
  - platform: esp32_can
    id: can_bus_onduleur
    can_id: 0
    rx_pin: GPIO7
    tx_pin: GPIO6
    bit_rate: 250kbps

uart:
  # RS232 TTL (CAN/RS connector)
  # take care of the PCB "jumper" TTL or 3.3V
  - id: uart232
    baud_rate: 2400
    rx_buffer_size: 256
    rx_pin: GPIO18
    tx_pin: GPIO8

  - id: uart485
    baud_rate: 115200
    rx_buffer_size: 256
    rx_pin: GPIO17 # B A Gnd to RJ45 1 2 3
    tx_pin: GPIO16

modbus:
  - id: modbus0
    uart_id: uart485
    flow_control_pin: GPIO46 # 485_DE / RTS

# Display backlight as Gradient Light

globals:
  - id: display_sleep
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: last_backlight_level
    type: uint8_t
    initial_value: "90"

output:
  - platform: ledc
    id: backlight_output
    # setup_priority: -20 # after display
    pin: GPIO15
    frequency: 500Hz
    min_power: 0.01
    max_power: 0.30
    zero_means_zero: true
  - platform: ledc
    id: buzzer_pwm
    pin: GPIO45

number:
  - platform: template
    id: backlight_level
    name: "Backlight"
    optimistic: true
    min_value: 0
    max_value: 100
    step: 2
    initial_value: 50
    restore_value: true
    # retain: true
    icon: "mdi:lightbulb-on-outline"
    unit_of_measurement: "%"
    on_value:
      then:
        - lambda: |-
            if (id(display_sleep) && x != 0)
              id(display0).wakeup();
            id(display_sleep) = (x == 0);
            if (x != 0)
              id(last_backlight_level) = x;
        - output.set_level:
            id: backlight_output
            level: !lambda "return x / 100.0;"

# BUZZER
rtttl:
  output: buzzer_pwm
  id: buzzer
  setup_priority: -30

script:
  - id: bip_ok
    mode: restart
    then:
      # 1. fast tic
      - lambda: |-
          id(buzzer_pwm).set_level(1.0);
          delayMicroseconds(10);
          id(buzzer_pwm).set_level(0);
  - id: bip_alarm
    mode: restart
    then:
      # 2. noisy meep meep
      - rtttl.play: "alarme:d=4,o=5,b=120:e,p,e"

# I2C TOUCHSCREEN CST3240
i2c:
  sda: GPIO09
  scl: GPIO03
  frequency: 400kHz

touchscreen:
  - platform: cst3240_i2c
    setup_priority: -20 # after display
    id: cst3240
    display: display0
    interrupt_pin:
      number: GPIO42
      inverted: true
      mode: INPUT_PULLUP
    on_release:
      lambda: "id(bip_ok).execute();"

binary_sensor:
  - platform: touchscreen
    name: "Test Button"
    touchscreen_id: cst3240
    # bottom right alarm test
    x_min: 350
    y_min: 200
    x_max: 480
    y_max: 272
    on_click:
      then:
        - lambda: "id(bip_alarm).execute();"

# Other Available GPIOs not used :
# USB: DN 19 DP 20
# EXT: 1 2 4 5
# Reset button: GPIO 0
# Debug UART: by default

# Used on display and HA diagnostics
text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip

  - platform: template
    id: esp_ip_address
    name: "WiFi IP address"
    entity_category: diagnostic
    update_interval: 60s
    icon: "mdi:ip-outline"
    lambda: |-
      return id(wifi_ip).state;

font:
  - file: "gfonts://Roboto"
    id: roboto_16
    size: 16

display:
  - platform: nv3041a_i80
    id: display0
    update_interval: 10s
    rotation: 0°
